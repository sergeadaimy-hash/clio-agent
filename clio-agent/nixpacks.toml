# Railway build: Node runtime plus Python for the PPTX generator and
# LibreOffice + poppler for true report previews.
[phases.setup]
nixPkgs = ["nodejs_20", "python312", "python312Packages.pip", "libreoffice", "poppler_utils"]

[phases.install]
cmds = [
  "npm ci",
  "pip3 install -r requirements.txt --break-system-packages"
]

[start]
cmd = "node server.js"
